name: Sync ImmortalWrt (360T7 DTS)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: padavanonly/immortalwrt-mt798x-6.6
  UPSTREAM_BRANCH: openwrt-24.10-6.6

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git config user.name "PoorMilk"
          git config user.email "PoorMilk@users.noreply.github.com"
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}
          git fetch origin
          git fetch upstream
          git reset --hard upstream/${{ env.UPSTREAM_BRANCH }}
          git checkout origin/main -- .github README.md target/linux/mediatek/dts/mt7981b-qihoo-360t7.dts || true
          git add .
          git commit -m "Sync upstream" || true
          git push -f origin main

      - name: Clean old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --repo "${{ github.repository }}" --limit 100 --json databaseId \
            --jq '.[5:] | .[].databaseId' | while read -r run_id; do
              if [ -n "$run_id" ]; then
                gh run delete "$run_id" --repo "${{ github.repository }}" || true
              fi
            done
